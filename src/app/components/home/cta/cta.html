<section class="cta" id="contact">
  <div class="cta-text" appScrollReveal>
    <small>Pronto para o próximo nível?</small>
    <h2>VAMOS TRANSFORMAR<br><span>SUA OPERAÇÃO</span></h2>
    <p>Responda três perguntas rápidas. Identificamos o principal gargalo e continuamos a análise da sua operação pelo WhatsApp.</p>
    <div class="cta-buttons">
      <button type="button" class="btn-primary" (click)="openDiagnosis()">
        Quero analisar minha operação
        <span aria-hidden="true">→</span>
      </button>
    </div>
  </div>

  <div class="cta-visual" appScrollReveal>
    <div class="cta-card">
      <div class="cta-card-header">
        <img src="assets/icone.png" alt="Nobreflow" class="cta-avatar">
        <div>
          <p class="cta-card-title">Nobreflow</p>
          <p class="cta-card-sub">Ecossistema Digital Sob Medida</p>
        </div>
      </div>
      <div class="cta-metrics">
        <div class="cta-metric">
          <span class="metric-value">ERP + IA</span>
          <span class="metric-label">Integrados</span>
        </div>
        <div class="cta-metric">
          <span class="metric-value">100%</span>
          <span class="metric-label">Exclusivo</span>
        </div>
        <div class="cta-metric">
          <span class="metric-value">24/7</span>
          <span class="metric-label">Disponibilidade</span>
        </div>
      </div>
    </div>
  </div>
</section>
